name: Release

"on":
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi

          python - <<'PY'
          import datetime
          import os

          datetime.datetime.strptime(os.environ["VERSION"], "%Y.%m.%d")
          PY

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set package version from tag
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: python .github/scripts/set-version.py "$VERSION"

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set package version from tag
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: python .github/scripts/set-version.py "$VERSION"

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/apollo-$VERSION-$PLATFORM.tar.gz" apollo

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -LiteralPath "target/$env:TARGET/release/apollo.exe" `
            -DestinationPath "dist/apollo-$env:VERSION-$env:PLATFORM.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --verify-tag \
            --generate-notes
